# ============================================================
# Movie App — Docker Compose (Root)
# ============================================================
#
# CARA PAKAI:
#   Jalankan dari folder root Movie-App:
#     docker compose up --build
#
#   Hentikan semua container:
#     docker compose down
#
#   Hentikan + hapus volume (fresh start):
#     docker compose down -v
#
#   Lihat log semua service:
#     docker compose logs -f
#
#   Lihat log 1 service:
#     docker compose logs -f backend
#
#   Cek status container:
#     docker compose ps
#
# PORT:
#   Frontend  → http://localhost:5173
#   Backend   → http://localhost:8080/api
#   Postgres  → localhost:5432
#   Redis     → localhost:6379
#
# VOLUME:
#   pgdata      → data PostgreSQL (persist)
#   redis-data  → data Redis (persist)
#   uploads     → file upload user (persist)
#
# SUB-COMPOSE (jalankan mandiri tanpa root):
#   Backend  → cd movie-app-backend-go   && docker compose up --build
#   Frontend → cd movie-app-frontend-react && docker compose up --build
#
# ============================================================

services:
  frontend:
    build:
      context: ./movie-app-frontend-react
      dockerfile: Dockerfile
    container_name: movieapp_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./movie-app-backend-go
      dockerfile: Dockerfile
    container_name: movieapp_backend
    restart: unless-stopped
    env_file:
      - ./movie-app-backend-go/.env
    environment:
      - DATABASE_HOST=postgres
      - REDIS_ADDR=redis:6379
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: movieapp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-movie_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.0.1
    container_name: movieapp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 20 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  uploads: {}
  pgdata: {}
  redis-data: {}
